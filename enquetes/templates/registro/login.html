{% extends 'base.html' %}
{% load static %}
{% block title %}Login{% endblock %}

{% block content %}
<h2>Login</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Entrar</button>
</form>
<p>Ainda não tem uma conta? <a href="{% url 'registro' %}">Registrar-se</a></p>
{% endblock %}
